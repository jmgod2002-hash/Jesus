<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Couverture évènement</title>
<script src="t_path.js"></script>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #c { position: relative; width: 1920px; height: 1005px; overflow: hidden; background: #64429e; font-family: "Fredoka", sans-serif; font-weight: 700; color: #fff; }
  .a { position: absolute; }
  .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); }
  .pill { display: inline-block; border-radius: 999px; }
  .chip { display: inline-flex; align-items: center; gap: 14px; background: #fff3e6; color: #64429e; font-size: 44px; border-radius: 999px; padding: 12px 34px 16px 16px; margin-right: 18px; }
  .card { position: absolute; width: 170px; height: 170px; border-radius: 40px; background: #fff3e6; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 0 rgba(0,0,0,.18); }
</style></head><body>
<div id="c">
  <div class="blob" style="left:-120px;top:-140px;width:420px;height:420px"></div>
  <div class="blob" style="left:760px;top:820px;width:300px;height:300px"></div>
  <div class="blob" style="left:1780px;top:-80px;width:260px;height:260px"></div>
  <div class="blob" style="left:1700px;top:860px;width:200px;height:200px;background:rgba(254,97,50,.25)"></div>

  <!-- rayons + toque -->
  <svg class="a" style="left:1050px;top:20px" width="820" height="820" viewBox="-100 -100 200 200">
    <g id="rays"></g>
  </svg>
  <svg class="a" style="left:1235px;top:150px;transform:rotate(-6deg)" width="450" height="450" viewBox="0 0 100 100">
    <path d="M26 44 L26 64 C 26 74, 74 74, 74 64 L74 44 L50 54 Z" fill="#d94a22"/>
    <path d="M50 16 L95 35 L50 54 L5 35 Z" fill="#fe6132"/><path d="M50 16 L95 35 L50 40 L5 35 Z" fill="#ff7a52"/>
    <path d="M50 35 L84 39" stroke="#ffd23f" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="35" r="3.6" fill="#ffd23f"/>
    <g transform="rotate(14 84 39)"><path d="M84 39 L84 60" stroke="#ffd23f" stroke-width="2.6" stroke-linecap="round"/><path d="M80 58 L88 58 L89.5 72 L78.5 72 Z" fill="#ffd23f"/></g>
  </svg>
  <div id="stars"></div>

  <!-- les 3 étapes en vignettes -->
  <div class="card" style="left:1130px;top:700px;transform:rotate(-7deg)"><svg width="120" height="120" viewBox="0 0 100 100"><rect x="27" y="6" width="46" height="88" rx="11" fill="#64429e"/><rect x="32" y="16" width="36" height="64" rx="4" fill="#fff"/><path d="M36 36 L41 36 L45 54 L60 54 L64 41 L43 41" stroke="#fe6132" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="61" r="3.5" fill="#fe6132"/><circle cx="58" cy="61" r="3.5" fill="#fe6132"/><circle cx="72" cy="12" r="11" fill="#fe6132" stroke="#fff" stroke-width="3"/><text x="72" y="17" font-size="14" font-family="Fredoka" font-weight="700" fill="#fff" text-anchor="middle">1</text></svg></div>
  <div class="card" style="left:1375px;top:745px;transform:rotate(4deg)"><svg width="120" height="120" viewBox="0 0 100 100"><path d="M30 46 Q 48 18 64 46" stroke="#d9cdee" stroke-width="3" stroke-dasharray="1 6" stroke-linecap="round" fill="none"/><rect x="6" y="34" width="24" height="44" rx="6" fill="#64429e"/><rect x="9" y="40" width="18" height="30" rx="2" fill="#fff"/><path d="M58 54 L76 40 L94 54 L94 84 L58 84 Z" fill="#fe6132"/><rect x="70" y="66" width="12" height="18" fill="#d94a22"/><rect x="64" y="56" width="8" height="6" fill="#fff3e6"/><rect x="80" y="56" width="8" height="6" fill="#fff3e6"/><g transform="translate(46 24) rotate(-20)"><path d="M9 0 L-7 -7 L-3 0 L-7 7 Z" fill="#64429e"/><path d="M9 0 L-3 0 L-5 4 Z" fill="#2b1a4a"/></g></svg></div>
  <div class="card" style="left:1620px;top:690px;transform:rotate(-3deg)"><svg width="125" height="125" viewBox="0 0 100 100"><path d="M2 44 L14 44 M4 54 L14 54 M2 64 L12 64" stroke="#d9cdee" stroke-width="4" stroke-linecap="round"/><rect x="16" y="38" width="46" height="32" rx="5" fill="#fe6132"/><rect x="29" y="46" width="18" height="16" rx="2" fill="#e0a86a"/><path d="M29 52 L47 52" stroke="#c98a4b" stroke-width="2.5"/><path d="M62 48 L76 48 L87 59 L87 70 L62 70 Z" fill="#64429e"/><path d="M66 52 L75 52 L82 59 L66 59 Z" fill="#fff"/><circle cx="30" cy="72" r="8.5" fill="#2b1a4a"/><circle cx="30" cy="72" r="3.5" fill="#fff3e6"/><circle cx="74" cy="72" r="8.5" fill="#2b1a4a"/><circle cx="74" cy="72" r="3.5" fill="#fff3e6"/></svg></div>

  <!-- textes -->
  <div class="a" style="left:110px;top:95px;display:flex;align-items:center;gap:22px">
    <svg id="logo" width="96" height="96" viewBox="0 0 1254 1254"></svg>
    <div style="font-size:58px;letter-spacing:.01em">Tadaa</div>
  </div>
  <div class="a" style="left:104px;top:228px;font-size:150px;line-height:1">Formation</div>
  <div class="a" style="left:96px;top:395px;transform:rotate(-3deg);transform-origin:left center">
    <div class="pill" style="font-size:142px;line-height:1;background:#fff;color:#fe6132;padding:22px 58px 32px;box-shadow:0 16px 0 #2b1a4a">DROPSHIPPING</div>
  </div>
  <div class="a" style="left:110px;top:620px;font-size:62px;line-height:1.15">Vends <span style="color:#ffd23f">sans stock</span>,<br>ton fournisseur livre.</div>
  <div class="a" style="left:104px;top:830px">
    <span class="chip"><svg width="52" height="52" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fe6132"/><path d="M28 52 L44 67 L73 35" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>En ligne</span>
    <span class="chip"><svg width="52" height="52" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fe6132"/><path d="M28 52 L44 67 L73 35" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Étape par étape</span>
  </div>
</div>
<script>
  const T = window.T_PATH;
  document.getElementById("rays").innerHTML = Array.from({ length: 14 }, (_, i) => `<path d="M0 0 L-8 -100 L8 -100 Z" fill="rgba(255,210,63,.2)" transform="rotate(${i * 360 / 14 + 6})"/>`).join("");
  document.getElementById("logo").innerHTML = `<defs><clipPath id="ld"><circle cx="626.5" cy="623.5" r="612"/></clipPath><clipPath id="lt"><path d="${T}"/></clipPath><clipPath id="le"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)"/></clipPath></defs>
    <circle cx="626.5" cy="623.5" r="612" fill="#fe6132"/><g clip-path="url(#ld)"><path d="${T}" fill="#fff3e6"/><g clip-path="url(#lt)"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)" fill="#64429e"/><g clip-path="url(#le)"><circle cx="444" cy="458" r="50" fill="#fff3e6"/></g></g></g>`;
  const st = [[1180, 130, 46, "#ffd23f"], [1760, 200, 36, "#fff"], [1250, 560, 30, "#fff"], [1800, 520, 50, "#ffd23f"], [1520, 90, 28, "#fff"], [1700, 380, 24, "#ffd23f"]];
  document.getElementById("stars").innerHTML = st.map(([x, y, s, c]) => `<svg class="a" style="left:${x}px;top:${y}px" width="${s}" height="${s}" viewBox="-10 -10 20 20"><path d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6Z" fill="${c}"/></svg>`).join("");
  window.ready = document.fonts.load("700 100px Fredoka").then(() => document.fonts.ready);
</script>
</body></html>
