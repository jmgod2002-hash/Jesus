<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tadaa Formation</title>
<script src="t_path.js"></script>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
  :root { --violet: #64429e; --orange: #fe6132; --creme: #fff3e6; --nuit: #2b1a4a; --jaune: #ffd23f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Fredoka", sans-serif; font-weight: 700; }
  .layer, .content { position: absolute; inset: 0; }
  .content { transform-origin: 540px 960px; }
  .wipe { position: absolute; border-radius: 50%; }
  .a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
  .txt { color: #fff; line-height: 1; letter-spacing: -0.01em; }
  .pill { border-radius: 999px; padding: 18px 48px 24px; }
  .blob { border-radius: 50%; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ───────── outils ─────────
const W = 1080, H = 1920, DUR = 20.5;
const cl = (x) => Math.max(0, Math.min(1, x));
const pr = (t, a, d) => cl((t - a) / d);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outQuint = (x) => 1 - Math.pow(1 - x, 5);
const inCubic = (x) => x * x * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
// ressort amorti : 0 → 1 avec un léger dépassement, mouvement organique
const spring = (t, a, f = 1.8, d = 8) => { const x = t - a; return x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(2 * Math.PI * f * x); };
// écrasement à l'atterrissage (1 au repos)
const squash = (t, a, amp = 0.22, f = 2.6, d = 7) => { const x = t - a; return x <= 0 ? 1 : 1 - amp * Math.exp(-d * x) * Math.cos(2 * Math.PI * f * x); };
const keys = (t, ks, ease = inOut) => { if (t <= ks[0][0]) return ks[0][1]; for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) return lerp(ks[i - 1][1], ks[i][1], ease((t - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0]))); return ks[ks.length - 1][1]; };
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const stage = document.getElementById("stage");
const el = (html, parent = stage) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const n = d.firstChild; parent.appendChild(n); return n; };
// place un élément par son centre ; org = point fixe des échelles (ex. "50% 100%" = pied)
const place = (n, { x = 540, y = 960, s = 1, sx = 1, sy = 1, r = 0, o = 1, org } = {}) => {
  if (org) n.style.transformOrigin = org;
  n.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s * sx},${s * sy})`;
  n.style.opacity = o; n.style.visibility = o <= 0.001 || Math.abs(s * sx * sy) < 0.001 ? "hidden" : "visible";
};
const setT = (n, tr) => n.setAttribute("transform", tr);

// ───────── mascotte (le T à l'œil) ─────────
const T = window.T_PATH; let mid = 0;
function mascot(parent, width) {
  const id = "m" + mid++;
  const n = el(`<div class="a" style="width:${width}px"><svg viewBox="190 200 880 910" width="${width}" height="${width * 910 / 880}">
    <defs><clipPath id="${id}t"><path d="${T}"/></clipPath><clipPath id="${id}e"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)"/></clipPath></defs>
    <path d="${T}" fill="#fe6132"/>
    <g clip-path="url(#${id}t)"><g class="lid"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)" fill="#fff"/>
    <g clip-path="url(#${id}e)"><circle class="pupil" cx="444" cy="458" r="50" fill="#fe6132"/></g></g></g></svg></div>`, parent);
  n.eye = (open, dx = 0, dy = 0) => { setT(n.querySelector(".lid"), `translate(382 430) scale(1 ${Math.max(0.06, open)}) translate(-382 -430)`); setT(n.querySelector(".pupil"), `translate(${dx} ${dy})`); };
  return n;
}
// clignement doux (fermeture/ouverture en 0,18 s)
const blink = (t, at) => { const x = (t - at) / 0.18; return x <= 0 || x >= 1 ? 1 : 0.06 + 0.94 * Math.abs(Math.cos(Math.PI * x)); };


// ───────── couches : chaque scène ouvre son fond en cercle, précédé d'un anneau clair ─────────
const SCENES = [
  { start: 0, color: "var(--violet)", from: [540, 960] },
  { start: 3.0, color: "var(--orange)", from: [540, 1500], ring: "rgba(255,255,255,.35)" },
  { start: 4.6, color: "var(--violet)", from: [880, 260], ring: "rgba(255,243,230,.5)" },
  { start: 8.85, color: "var(--creme)", from: [160, 1650], ring: "var(--orange)" },
  { start: 15.1, color: "var(--orange)", from: [540, 600], ring: "rgba(255,255,255,.4)" },
];
SCENES.forEach((sc, i) => {
  const R = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - sc.from[0], y - sc.from[1]))) + 10;
  const circ = (bg) => `<div class="wipe" style="width:${2 * R}px;height:${2 * R}px;left:${sc.from[0] - R}px;top:${sc.from[1] - R}px;background:${bg}"></div>`;
  sc.layer = el(`<div class="layer"></div>`);
  if (sc.ring) sc.ringEl = el(circ(sc.ring), sc.layer);
  sc.wipe = el(circ(sc.color), sc.layer);
  sc.c = el(`<div class="content"></div>`, sc.layer);
  sc.end = SCENES[i + 1] ? SCENES[i + 1].start : DUR;
});
const [S1, S2, S3, S4, S5] = SCENES.map((s) => s.c);
const deco = (parent, list, color) => list.map(([x, y, r]) => ({ x, y, r, n: el(`<div class="a blob" style="width:${2 * r}px;height:${2 * r}px;background:${color}"></div>`, parent) }));
const decoV1 = deco(S1, [[120, 260, 90], [960, 520, 140], [170, 1500, 60], [900, 1650, 110]], "rgba(255,255,255,.07)");
const decoO2 = deco(S2, [[150, 330, 120], [940, 1350, 170], [120, 1650, 70]], "rgba(255,255,255,.12)");
const decoV3 = deco(S3, [[960, 180, 120], [110, 1600, 150], [990, 1650, 60]], "rgba(255,255,255,.07)");
const decoC4 = deco(S4, [[990, 1000, 120], [70, 1600, 90]], "rgba(254,97,50,.07)");
const decoO5 = deco(S5, [[130, 250, 110], [980, 1500, 150], [150, 1700, 90]], "rgba(255,255,255,.12)");
const floatDeco = (arr, t) => arr.forEach((d, i) => place(d.n, { x: d.x + Math.sin(t * 0.9 + i * 2) * 22, y: d.y + Math.cos(t * 0.7 + i) * 28, s: 1 + 0.06 * Math.sin(t * 1.3 + i) }));
const svgEl = (tag, attrs, parent) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const draw = (p, k) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - cl(k)); };
// tampon : grossit puis s'écrase sur l'écran
const stamp = (t, a) => (t < a ? 0 : lerp(2.3, 1, inCubic(pr(t, a, 0.2))) * (t > a + 0.2 ? squash(t, a + 0.2, 0.08, 3, 7) : 1));

// ───────── scène 1 : accroche ─────────
const s1a = el(`<div class="a txt" style="font-size:120px">Tu veux vendre</div>`, S1);
const s1b = el(`<div class="a txt" style="font-size:180px">des produits</div>`, S1);
const s1c = el(`<div class="a txt pill" style="font-size:130px;background:#fff;color:var(--orange)">sans stock ?</div>`, S1);
const m1 = mascot(S1, 560);

// ───────── scène 2 : tu es au bon endroit ─────────
const pin2 = el(`<div class="a"><svg width="210" height="262" viewBox="0 0 120 150"><path d="M60 146 C 30 104, 6 82, 6 56 A54 54 0 0 1 114 56 C 114 82, 90 104, 60 146Z" fill="#64429e"/><circle cx="60" cy="56" r="22" fill="#fff"/></svg></div>`, S2);
const pinShadow2 = el(`<div class="a" style="width:150px;height:34px;border-radius:50%;background:rgba(43,26,74,.2)"></div>`, S2);
const s2 = el(`<div class="a txt" style="font-size:124px;line-height:1.04;text-align:center;background:var(--violet);border-radius:56px;padding:40px 64px 52px;box-shadow:0 18px 0 var(--nuit)">Tu es au<br>bon endroit !</div>`, S2);
const ring2 = el(`<div class="a" style="width:760px;height:760px;border-radius:50%;border:16px solid rgba(255,255,255,.8)"></div>`, S2);

// ───────── scène 3 : je t'apprends le dropshipping ─────────
const rays = el(`<svg class="a" width="760" height="760" viewBox="-100 -100 200 200">${Array.from({ length: 12 }, (_, i) => `<path d="M0 0 L-9 -100 L9 -100 Z" fill="rgba(255,210,63,.22)" transform="rotate(${i * 30})"/>`).join("")}</svg>`, S3);
const cap = el(`<div class="a"><svg width="340" height="340" viewBox="0 0 100 100">
  <path d="M26 44 L26 64 C 26 74, 74 74, 74 64 L74 44 L50 54 Z" fill="#d94a22"/>
  <path d="M50 16 L95 35 L50 54 L5 35 Z" fill="#fe6132"/><path d="M50 16 L95 35 L50 40 L5 35 Z" fill="#ff7a52"/>
  <path d="M50 35 L84 39" stroke="#ffd23f" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="35" r="3.6" fill="#ffd23f"/>
  <g class="tas"><path d="M84 39 L84 60" stroke="#ffd23f" stroke-width="2.6" stroke-linecap="round"/><path d="M80 58 L88 58 L89.5 72 L78.5 72 Z" fill="#ffd23f"/></g></svg></div>`, S3);
const tassel = cap.querySelector(".tas");
const stars = Array.from({ length: 10 }, (_, i) => ({ a: -Math.PI / 2 + (i - 4.5) * 0.28, v: 300 + (i % 3) * 80, n: el(`<div class="a"><svg width="54" height="54" viewBox="-10 -10 20 20"><path d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6Z" fill="${i % 2 ? "#ffd23f" : "#fff"}"/></svg></div>`, S3) }));
const s3a = el(`<div class="a txt" style="font-size:100px">Je t'apprends le</div>`, S3);
const s3b = el(`<div class="a txt pill" style="font-size:108px;background:#fff;color:var(--orange);box-shadow:0 14px 0 var(--nuit)">DROPSHIPPING</div>`, S3);
const s3c = el(`<div class="a txt" style="font-size:86px">dans ton pays</div>`, S3);
const chip = (label) => { const c = el(`<div class="a txt pill" style="font-size:62px;background:var(--creme);color:var(--violet);display:flex;align-items:center;gap:16px;padding:16px 36px 20px 22px"><svg width="62" height="62" viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="46" fill="#fe6132"/><path class="tick" d="M28 52 L44 67 L73 35" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>${label}</div>`, S3);
  c.tick = c.querySelector(".tick"); return c; };
const chips = [chip("facilement"), chip("sans stock")];

// ───────── scène 4 : comment ça marche ─────────
const s4t = el(`<div class="a txt" style="font-size:92px;color:var(--violet)">Comment ça marche ?</div>`, S4);
const quad = (u, p0, p1, p2) => [(1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0], (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1]];
const ICON4 = [
  // 1 — le client commande : panier qui sautille, notification « 1 »
  { svg: `<rect x="27" y="6" width="46" height="88" rx="11" fill="#64429e"/><rect x="32" y="16" width="36" height="64" rx="4" fill="#fff"/><g class="cart"><path d="M36 36 L41 36 L45 54 L60 54 L64 41 L43 41" stroke="#fe6132" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="61" r="3.5" fill="#fe6132"/><circle cx="58" cy="61" r="3.5" fill="#fe6132"/></g><g class="b"><circle cx="72" cy="12" r="11" fill="#fe6132" stroke="#fff" stroke-width="3"/><text x="72" y="17" font-size="14" font-family="Fredoka" font-weight="700" fill="#fff" text-anchor="middle">1</text></g>`,
    anim: (q, lt) => { const ph = lt % 1.6; setT(q.cart, `translate(0 ${-5 * Math.abs(Math.sin(lt * 5)) * (ph < 0.6 ? 1 : 0.3)})`);
      setT(q.b, `translate(72 12) scale(${spring(ph, 0.1, 2, 9) * (1 - cl((ph - 1.4) / 0.2))}) translate(-72 -12)`); } },
  // 2 — tu transmets au fournisseur : un avion en papier part du téléphone vers l'entrepôt
  { svg: `<path d="M30 46 Q 48 18 64 46" stroke="#d9cdee" stroke-width="3" stroke-dasharray="1 6" stroke-linecap="round" fill="none"/><rect x="6" y="34" width="24" height="44" rx="6" fill="#64429e"/><rect x="9" y="40" width="18" height="30" rx="2" fill="#fff"/>
    <g class="wh"><path d="M58 54 L76 40 L94 54 L94 84 L58 84 Z" fill="#fe6132"/><rect x="70" y="66" width="12" height="18" fill="#d94a22"/><rect x="64" y="56" width="8" height="6" fill="#fff3e6"/><rect x="80" y="56" width="8" height="6" fill="#fff3e6"/></g>
    <g class="pp"><path d="M9 0 L-7 -7 L-3 0 L-7 7 Z" fill="#64429e"/><path d="M9 0 L-3 0 L-5 4 Z" fill="#2b1a4a"/></g>`,
    anim: (q, lt) => { const u = (lt * 0.75) % 1, k = inOut(u), [x, y] = quad(k, [24, 44], [48, 14], [66, 48]), [x2, y2] = quad(Math.min(1, k + 0.02), [24, 44], [48, 14], [66, 48]);
      setT(q.pp, `translate(${x} ${y}) rotate(${Math.atan2(y2 - y, x2 - x) * 180 / Math.PI}) scale(${Math.sin(u * Math.PI) * 1.1 + 0.2})`); q.pp.setAttribute("opacity", cl(Math.sin(u * Math.PI) * 3));
      const hit = squash(lt % (1 / 0.75), 0.95 / 0.75, 0.12, 3, 9); setT(q.wh, `translate(76 84) scale(${2 - hit} ${hit}) translate(-76 -84)`); } },
  // 3 — le fournisseur livre : camionnette qui roule, roues et lignes de vitesse
  { svg: `${[0, 1, 2].map((i) => `<path class="s${i}" d="M0 0 L14 0" stroke="#d9cdee" stroke-width="4" stroke-linecap="round"/>`).join("")}<g class="van"><rect x="16" y="38" width="46" height="32" rx="5" fill="#fe6132"/><rect x="29" y="46" width="18" height="16" rx="2" fill="#e0a86a"/><path d="M29 52 L47 52" stroke="#c98a4b" stroke-width="2.5"/><path d="M62 48 L76 48 L87 59 L87 70 L62 70 Z" fill="#64429e"/><path d="M66 52 L75 52 L82 59 L66 59 Z" fill="#fff"/>
    <g class="w1"><circle cx="0" cy="0" r="8.5" fill="#2b1a4a"/><circle r="3.5" fill="#fff3e6"/><path d="M0 -7 L0 7" stroke="#fff3e6" stroke-width="2"/></g><g class="w2"><circle cx="0" cy="0" r="8.5" fill="#2b1a4a"/><circle r="3.5" fill="#fff3e6"/><path d="M0 -7 L0 7" stroke="#fff3e6" stroke-width="2"/></g></g>`,
    anim: (q, lt) => { setT(q.van, `translate(${Math.sin(lt * 2) * 3} ${-1.5 * Math.abs(Math.sin(lt * 14))})`);
      setT(q.w1, `translate(30 72) rotate(${lt * 720})`); setT(q.w2, `translate(74 72) rotate(${lt * 720})`);
      [q.s0, q.s1, q.s2].forEach((s, i) => { const u = (lt * 1.6 + i / 3) % 1; setT(s, `translate(${12 - u * 14} ${44 + i * 10})`); s.setAttribute("opacity", Math.sin(u * Math.PI)); }); } },
];
const rows = [["Le client commande", "sur ta page"], ["Tu transmets tout", "à ton fournisseur"], ["Il livre ton client", "pas toi !"]].map(([a, b], i) => {
  const card = el(`<div class="a" style="width:210px;height:210px;border-radius:48px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 0 rgba(100,66,158,.18)"><svg width="150" height="150" viewBox="0 0 100 100">${ICON4[i].svg}</svg></div>`, S4);
  card.q = {}; card.querySelectorAll("[class]").forEach((n) => (card.q[n.getAttribute("class")] = n));
  const txt = el(`<div class="a" style="width:600px"><div class="txt" style="font-size:62px;color:var(--nuit)">${a}</div><div class="txt" style="font-size:48px;font-weight:600;color:var(--violet);margin-top:10px">${b}</div></div>`, S4);
  return { card, txt, anim: ICON4[i].anim };
});
const links = el(`<svg class="a" width="1080" height="1920" viewBox="0 0 1080 1920">${[0, 1].map((i) => `<path class="k${i}" d="M200 ${635 + i * 280} L200 ${705 + i * 280}" stroke="#fe6132" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 20" fill="none"/>`).join("")}</svg>`, S4);
const s4s = el(`<div class="a txt" style="font-size:88px;line-height:1.04;text-align:center;background:var(--violet);border-radius:48px;padding:30px 56px 40px;box-shadow:0 16px 0 var(--nuit)">Pas de livraison<br>à gérer !</div>`, S4);

// ───────── scène 5 : appel à l'action ─────────
const logo = el(`<div class="a"><svg width="380" height="380" viewBox="0 0 1254 1254">
  <defs><clipPath id="ld"><circle cx="626.5" cy="623.5" r="612"/></clipPath><clipPath id="lt"><path d="${T}"/></clipPath>
  <clipPath id="le"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)"/></clipPath></defs>
  <circle cx="626.5" cy="623.5" r="612" fill="#64429e"/>
  <g clip-path="url(#ld)"><g id="lT"><path d="${T}" fill="#fe6132"/><g clip-path="url(#lt)"><g id="lLid">
  <ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)" fill="#fff"/><g clip-path="url(#le)"><circle id="lPupil" cx="444" cy="458" r="50" fill="#fe6132"/></g></g></g></g></g></svg></div>`, S5);
const lT = logo.querySelector("#lT"), lLid = logo.querySelector("#lLid"), lPupil = logo.querySelector("#lPupil");
const s5a = el(`<div class="a txt" style="font-size:120px">Commente</div>`, S5);
const s5b = el(`<div class="a txt pill" style="font-size:140px;background:#fff;color:var(--violet);box-shadow:0 14px 0 var(--nuit);padding:22px 60px 30px">FORMATION</div>`, S5);
const bubble = el(`<div class="a"><svg width="190" height="170" viewBox="0 0 100 90"><path d="M50 6 C 76 6, 94 20, 94 40 C 94 60, 76 74, 50 74 C 44 74, 38 73, 33 71 L14 84 L18 64 C 10 58, 6 50, 6 40 C 6 20, 24 6, 50 6Z" fill="#64429e"/>${[0, 1, 2].map((i) => `<circle class="d${i}" cx="${32 + i * 18}" cy="40" r="7" fill="#fff"/>`).join("")}</svg></div>`, S5);
const dots = [0, 1, 2].map((i) => bubble.querySelector(`.d${i}`));
const s5c = el(`<div class="a txt" style="font-size:66px">et je t'envoie le programme</div>`, S5);
const s5d = el(`<div class="a txt" style="font-size:96px;background:var(--violet);border-radius:40px;padding:26px 54px 34px;box-shadow:0 14px 0 var(--nuit)">À ne pas rater !</div>`, S5);
const arrow = el(`<svg class="a" width="1080" height="1920" viewBox="0 0 1080 1920"><path class="ar" d="M790 1090 C 900 1080, 960 1130, 975 1215" stroke="#fff" stroke-width="16" stroke-linecap="round" fill="none"/><path class="ah" d="M950 1190 L977 1228 L1004 1188" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`, S5);
const arPath = arrow.querySelector(".ar"), arHead = arrow.querySelector(".ah");
const confetti = el(`<svg class="a" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>`, S5);
const CONF = Array.from({ length: 40 }, (_, i) => {
  const a = -Math.PI / 2 + (rnd() - 0.5) * 2.8, v = 700 + rnd() * 900, col = ["#64429e", "#fff", "#ffd23f", "#2b1a4a", "#fff3e6"][i % 5];
  const n = svgEl(i % 3 ? "rect" : "circle", i % 3 ? { width: 18 + rnd() * 14, height: 30 + rnd() * 16, x: -14, y: -20, fill: col } : { r: 11 + rnd() * 7, fill: col }, confetti);
  return { n, vx: Math.cos(a) * v, vy: Math.sin(a) * v, spin: (rnd() - 0.5) * 900, flip: 4 + rnd() * 6, ph: rnd() * 6 };
});

// ───────── temps clés (à recaler sur la voix) ─────────
const K = { // calés sur la voix ElevenLabs (transcription mot par mot)
  s1a: -0.12, s1b: 0.6, s1c: 2.35,                       // « Tu veux vendre » · « des produits » · « pas de stock »
  pin: 3.15, s2: 3.6,                                    // « bon endroit » (3,78 s)
  cap: 4.7, s3a: 4.85, s3b: 5.55, s3c: 6.2, chip1: 7.2, chip2: 8.05, // « dropshipping » 5,72 · « dans ton pays » 6,26 · « facilement » 7,28 · « sans stock » 8,12
  s4t: 9.0, row1: 9.5, row2: 10.5, row3: 12.9, s4s: 14.3, // « client commande » 9,62 · « tu transmets » 10,56 · « ce n'est même pas toi » 12,96 · « livraison » 14,5
  logo: 15.2, s5a: 15.3, s5b: 15.6, bubble: 15.9, s5c: 16.4, arrow: 16.6, s5d: 17.45, blink: 19.4, // « Commente » 15,37 · « formation » 15,66 · « et je t'envoie » 16,46 · « À ne pas rater » 17,63
};

// ───────── l'image à l'instant t ─────────
window.seek = (t) => {
  SCENES.forEach((sc, i) => {
    const next = SCENES[i + 1], visible = t >= sc.start - 0.1 && (!next || t < next.start + 0.65);
    sc.layer.style.display = visible ? "block" : "none";
    if (!visible) return;
    if (i > 0) { sc.wipe.style.transform = `scale(${inOut(pr(t, sc.start, 0.6))})`; sc.ringEl.style.transform = `scale(${inOut(pr(t, sc.start - 0.08, 0.6))})`; }
    const inK = i === 0 ? 1 : outCubic(pr(t, sc.start + 0.1, 0.5)), outK = next ? inCubic(pr(t, next.start, 0.5)) : 0;
    const z = (0.94 + 0.06 * inK) * (1 + 0.025 * pr(t, sc.start, sc.end - sc.start)) * (1 + 0.12 * outK);
    const shake = (a) => (t > a && t < a + 0.4 ? Math.sin(t * 95) * 16 * Math.exp(-(t - a) * 9) : 0);
    const sh = i === 1 ? shake(K.s2 + 0.2) : i === 3 ? shake(K.s4s + 0.2) : i === 4 ? shake(K.s5d + 0.2) : 0;
    sc.c.style.transform = `translate(${sh}px, ${sh * 0.5}px) scale(${z})`;
    sc.c.style.opacity = i === 0 ? 1 : Math.min(inK, 1 - outK);
  });

  // 1 — accroche
  floatDeco(decoV1, t);
  place(s1a, { y: 450, s: spring(t, K.s1a), r: -6 * (1 - outCubic(pr(t, K.s1a, 0.45))) });
  place(s1b, { y: 630, s: spring(t, K.s1b), r: 6 * (1 - outCubic(pr(t, K.s1b, 0.45))) });
  place(s1c, { y: 840, s: spring(t, K.s1c), r: lerp(-10, -3, outCubic(pr(t, K.s1c, 0.5))) + Math.sin((t - K.s1c - 0.5) * 4) * 1.5 * pr(t, K.s1c + 0.5, 0.4) });
  const rise = spring(t, 0.5, 1.4, 6.5);
  place(m1, { y: lerp(2300, 1500, rise) + Math.sin(t * 2.2) * 8 * pr(t, 1.3, 0.5), r: 6 + Math.sin(t * 2.6) * 2.5, org: "50% 100%", sy: squash(t, 0.85, 0.1), sx: 2 - squash(t, 0.85, 0.1) });
  const open1 = t < 1.0 ? 0.06 : lerp(0.06, 1, outBack(pr(t, 1.0, 0.2), 2.5));
  m1.eye(open1 * blink(t, 2.5), keys(t, [[1.2, 0], [1.5, -40]]), keys(t, [[1.2, 0], [1.5, -46]]));

  // 2 — tu es au bon endroit : l'épingle tombe, le tampon s'écrase
  floatDeco(decoO2, t);
  const pinY = lerp(-250, 430, Math.min(1, inCubic(pr(t, K.pin, 0.3)))), pinSq = squash(t, K.pin + 0.3, 0.25, 2.8, 8);
  place(pin2, { y: pinY + Math.sin(t * 3) * 6 * pr(t, K.pin + 0.8, 0.4), org: "50% 100%", sy: pinSq, sx: 2 - pinSq, o: t < K.pin ? 0 : 1 });
  place(pinShadow2, { y: 568, s: lerp(0.2, 1, pr(t, K.pin, 0.3)), o: t < K.pin ? 0 : 1 });
  place(s2, { y: 880, s: stamp(t, K.s2), r: -4 + Math.sin((t - K.s2 - 0.6) * 3) * 1.5 * pr(t, K.s2 + 0.6, 0.4), o: outCubic(pr(t, K.s2, 0.2)) });
  const rk = pr(t, K.s2 + 0.2, 0.6); place(ring2, { y: 880, s: lerp(0.6, 1.5, outCubic(rk)), o: t < K.s2 + 0.2 ? 0 : 1 - rk });

  // 3 — je t'apprends le dropshipping
  floatDeco(decoV3, t);
  const capFall = inCubic(pr(t, K.cap, 0.35)), capSq = squash(t, K.cap + 0.35, 0.2, 2.6, 7);
  place(rays, { y: 450, s: lerp(0.4, 1, outCubic(pr(t, K.cap + 0.35, 0.6))), r: t * 18, o: t < K.cap + 0.35 ? 0 : 1 });
  place(cap, { y: lerp(-300, 460, capFall) + Math.sin(t * 2.2) * 8 * pr(t, K.cap + 1, 0.5), r: lerp(-25, 0, capFall) + Math.sin(t * 1.7) * 2 * pr(t, K.cap + 1, 0.5), org: "50% 75%", sy: capSq, sx: 2 - capSq, o: t < K.cap ? 0 : 1 });
  const tu = Math.max(0, t - K.cap - 0.35);
  setT(tassel, `rotate(${(t < K.cap + 0.35 ? -20 : 28 * Math.exp(-2 * tu) * Math.sin(9 * tu)) + 4 * Math.sin(t * 2.4)} 84 39)`);
  stars.forEach((s) => { const u = t - K.cap - 0.35, e = 1 - Math.exp(-3 * Math.max(0, u)); place(s.n, { x: 540 + Math.cos(s.a) * s.v * e, y: 450 + Math.sin(s.a) * s.v * e + 120 * Math.max(0, u) ** 2, s: u < 0 ? 0 : 1 - cl((u - 0.6) / 0.5), r: u * 200 }); });
  place(s3a, { y: 760, s: spring(t, K.s3a) });
  place(s3b, { y: 905, s: stamp(t, K.s3b), r: -3 + Math.sin((t - K.s3b - 0.6) * 3) * 1.5 * pr(t, K.s3b + 0.6, 0.4), o: outCubic(pr(t, K.s3b, 0.2)) });
  place(s3c, { y: 1060, o: outCubic(pr(t, K.s3c, 0.35)) }); s3c.style.transform += ` translateY(${lerp(40, 0, outQuint(pr(t, K.s3c, 0.5)))}px)`;
  chips.forEach((c, i) => { const a = i ? K.chip2 : K.chip1; place(c, { x: 540, y: 1215 + i * 125 + Math.sin(t * 2.5 + i * 2) * 6 * pr(t, a + 0.5, 0.4), s: spring(t, a), r: (i ? 3 : -3) * (1 - outCubic(pr(t, a, 0.5))) }); draw(c.tick, outCubic(pr(t, a + 0.15, 0.25))); });

  // 4 — comment ça marche
  floatDeco(decoC4, t);
  place(s4t, { y: 250, s: spring(t, K.s4t) });
  [K.row1, K.row2, K.row3].forEach((a, i) => { const r = rows[i], k = outQuint(pr(t, a, 0.55));
    place(r.card, { x: 200, y: 530 + i * 280, s: spring(t, a, 1.8, 7), r: (1 - outCubic(pr(t, a, 0.5))) * (i % 2 ? 14 : -14) + Math.sin(t * 2 + i) * 1.5 * pr(t, a + 0.5, 0.4) });
    place(r.txt, { x: 660, y: 530 + i * 280, o: outCubic(pr(t, a + 0.08, 0.3)) }); r.txt.style.transform += ` translateX(${lerp(80, 0, k)}px)`;
    r.anim(r.card.q, Math.max(0, t - a - 0.2)); });
  draw(links.querySelector(".k0"), pr(t, K.row2 - 0.35, 0.3)); draw(links.querySelector(".k1"), pr(t, K.row3 - 0.35, 0.3));
  place(s4s, { y: 1400, s: stamp(t, K.s4s), r: -4 + Math.sin((t - K.s4s - 0.6) * 3) * 1.5 * pr(t, K.s4s + 0.6, 0.4), o: outCubic(pr(t, K.s4s, 0.2)) });

  // 5 — commente FORMATION
  floatDeco(decoO5, t);
  place(logo, { y: 400, s: spring(t, K.logo, 1.6, 7), r: Math.sin((t - K.logo - 0.9) * 2) * 1.6 * pr(t, K.logo + 0.9, 0.5) });
  const drop = inCubic(pr(t, K.logo + 0.15, 0.3)), land = K.logo + 0.45, sq = squash(t, land, 0.2, 2.6, 7);
  setT(lT, `translate(0 ${lerp(-1250, 0, drop)}) translate(690 1060) scale(${t < land ? 0.95 : 2 - sq} ${t < land ? 1.08 : sq}) translate(-690 -1060)`);
  const lid5 = (t < land + 0.2 ? 0.06 : lerp(0.06, 1, outBack(pr(t, land + 0.2, 0.2), 2.5))) * blink(t, K.blink);
  setT(lLid, `translate(382 430) scale(1 ${Math.max(0.06, lid5)}) translate(-382 -430)`);
  setT(lPupil, `translate(${keys(t, [[land + 0.4, 0], [land + 0.7, -10], [land + 1.4, -10], [land + 1.7, 0]])} ${keys(t, [[land + 0.4, 0], [land + 0.7, 34], [land + 1.4, 34], [land + 1.7, 0]])})`);
  place(s5a, { y: 720, s: spring(t, K.s5a) });
  place(s5b, { y: 880, s: spring(t, K.s5b) * (1 + 0.04 * Math.sin((t - K.s5b - 0.6) * 6) * pr(t, K.s5b + 0.6, 0.4)), r: -2 });
  place(bubble, { x: 950, y: 690, s: 0.85 * spring(t, K.bubble, 1.8, 7), r: 8 + Math.sin(t * 3) * 3 });
  dots.forEach((d, i) => setT(d, `translate(0 ${-6 * Math.max(0, Math.sin((t - K.bubble - 0.2) * 7 - i * 0.9))})`));
  place(s5c, { y: 1030, o: outCubic(pr(t, K.s5c, 0.35)) }); s5c.style.transform += ` translateY(${lerp(40, 0, outQuint(pr(t, K.s5c, 0.5)))}px)`;
  draw(arPath, outCubic(pr(t, K.arrow, 0.35))); draw(arHead, outCubic(pr(t, K.arrow + 0.3, 0.15)));
  const ab = Math.sin((t - K.arrow - 0.5) * 6) * 8 * pr(t, K.arrow + 0.5, 0.3); arrow.style.transform = `translate(${ab}px, ${ab}px)`;
  place(s5d, { y: 1240, s: stamp(t, K.s5d), r: -4 + Math.sin((t - K.s5d - 0.6) * 3) * 1.5 * pr(t, K.s5d + 0.6, 0.4), o: outCubic(pr(t, K.s5d, 0.2)) });
  const ct = t - K.s5b;
  confetti.style.visibility = ct > 0 && ct < 2.4 ? "visible" : "hidden";
  CONF.forEach((c) => { const dr = (1 - Math.exp(-2.2 * ct)) / 2.2, x = 540 + c.vx * dr, y = 880 + c.vy * dr + 700 * ct * ct;
    setT(c.n, `translate(${x} ${y}) rotate(${c.spin * ct}) scale(${Math.cos(c.ph + ct * c.flip)} 1)`); c.n.setAttribute("opacity", 1 - cl((ct - 1.6) / 0.7)); });
};

// ───────── bruitages (rendus hors temps réel, volume réduit pour laisser place à la voix) ─────────
window.renderAudio = async () => {
  const SR = 48000, ctx = new OfflineAudioContext(2, Math.round(SR * DUR), SR);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  const master = ctx.createGain(); master.gain.value = 0.7; master.connect(comp); comp.connect(ctx.destination);
  const noiseBuf = ctx.createBuffer(1, SR * 2, SR); const nd = noiseBuf.getChannelData(0); let s = 1; for (let i = 0; i < nd.length; i++) { s = (s * 16807) % 2147483647; nd[i] = (s / 2147483647) * 2 - 1; }
  const pan = (p) => { const n = ctx.createStereoPanner(); n.pan.value = p; n.connect(master); return n; };
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const tone = (t, f0, f1, d, vol = 0.4, type = "sine", p = 0) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); env(g, t, 0.005, vol, d); o.connect(g).connect(pan(p)); o.start(t); o.stop(t + d + 0.05); };
  const noise = (t, d, f0, f1, vol = 0.3, q = 1.2, type = "bandpass", p = 0) => { const sN = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); sN.buffer = noiseBuf; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + d * 0.45); g.gain.linearRampToValueAtTime(0, t + d); sN.connect(f).connect(g).connect(pan(p)); sN.start(t); sN.stop(t + d); };
  const popS = (t, f = 520, v = 0.3, p = 0) => tone(t, f * 1.8, f, 0.09, v, "sine", p);
  const whoosh = (t, d = 0.55) => noise(t - 0.12, d, 300, 3500, 0.3);
  const thud = (t, v = 0.7) => { tone(t, 160, 45, 0.25, v); noise(t, 0.08, 1200, 300, 0.2, 0.8, "lowpass"); };
  const chord = (t, freqs, d, vol) => freqs.forEach((f, k) => { tone(t, f, f, d, vol, "triangle", (k - 1) * 0.25); tone(t, f * 2, f * 2, d * 0.6, vol * 0.25, "sine"); });
  // 1
  [[K.s1a, 480], [K.s1b, 560], [K.s1c, 660]].forEach(([t, f]) => popS(Math.max(0, t), f, 0.22)); noise(0.5, 0.45, 600, 1800, 0.12); popS(1.0, 900, 0.12);
  // 2 — épingle + tampon
  whoosh(SCENES[1].start); noise(K.pin, 0.3, 2500, 600, 0.12); thud(K.pin + 0.3, 0.45); thud(K.s2 + 0.2, 0.8);
  // 3 — toque, tampon, coches
  whoosh(SCENES[2].start); noise(K.cap, 0.35, 2500, 500, 0.15); thud(K.cap + 0.35, 0.55); chord(K.cap + 0.4, [1047, 1319, 1568], 1.0, 0.07);
  popS(K.s3a, 520, 0.18); thud(K.s3b + 0.2, 0.6); popS(K.s3c, 600, 0.12);
  [K.chip1, K.chip2].forEach((t, i) => { popS(t, 620 + i * 80, 0.18); tone(t + 0.15, 1320 + i * 160, 1760 + i * 160, 0.12, 0.08, "triangle"); });
  // 4 — étapes
  whoosh(SCENES[3].start); popS(K.s4t, 520, 0.18);
  [K.row1, K.row2, K.row3].forEach((t, i) => { popS(t, 560 + i * 80, 0.2); tone(t + 0.05, 880 * [1, 1.26, 1.5][i], 880 * [1, 1.26, 1.5][i], 0.3, 0.1, "triangle"); });
  noise(K.row2 + 0.3, 0.5, 1200, 3500, 0.08, 1, "bandpass", 0.3); noise(K.row3 + 0.2, 0.8, 200, 600, 0.12, 0.8, "lowpass", -0.3); thud(K.s4s + 0.2, 0.8);
  // 5 — appel à l'action
  whoosh(SCENES[4].start); popS(K.logo, 420, 0.25); noise(K.logo + 0.15, 0.3, 500, 2500, 0.15); thud(K.logo + 0.45, 0.6); popS(K.s5a, 520, 0.18);
  chord(K.s5b, [784, 988], 0.16, 0.08); chord(K.s5b + 0.18, [1047, 1319, 1568], 1.2, 0.07); popS(K.bubble, 760, 0.18);
  noise(K.arrow, 0.35, 1500, 3500, 0.1, 1, "bandpass", 0.5); thud(K.s5d + 0.2, 0.8);
  const buf = await ctx.startRendering();
  const n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4)), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const ws = (o, str) => [...str].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  ws(0, "RIFF"); out.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); ws(36, "data"); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  const bytes = new Uint8Array(out.buffer); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

window.ready = Promise.all([document.fonts.load("700 100px Fredoka"), document.fonts.load("600 100px Fredoka")]).then(() => document.fonts.ready).then(() => window.seek(0));
</script>
