<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tadaa TikTok</title>
<script src="t_path.js"></script>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
  :root { --violet: #64429e; --orange: #fe6132; --creme: #fff3e6; --nuit: #2b1a4a; --jaune: #ffd23f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Fredoka", sans-serif; font-weight: 700; }
  .layer, .content { position: absolute; inset: 0; }
  .wipe { position: absolute; border-radius: 50%; }
  .a { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
  .txt { color: #fff; line-height: 1; letter-spacing: -0.01em; }
  .pill { border-radius: 999px; padding: 18px 48px 24px; }
  .blob { border-radius: 50%; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ───────── outils ─────────
const W = 1080, H = 1920, DUR = 16;
const cl = (x) => Math.max(0, Math.min(1, x));
const pr = (t, a, d) => cl((t - a) / d);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const pop = (t, a, d = 0.4) => outBack(pr(t, a, d));
// suite de clés [temps, valeur] avec interpolation adoucie
const keys = (t, ks, ease = inOut) => { if (t <= ks[0][0]) return ks[0][1]; for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) return lerp(ks[i - 1][1], ks[i][1], ease((t - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0]))); return ks[ks.length - 1][1]; };
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const stage = document.getElementById("stage");
const el = (html, parent = stage) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const n = d.firstChild; parent.appendChild(n); return n; };
// place un élément par son centre
const place = (n, { x = 540, y = 960, s = 1, sx = 1, sy = 1, r = 0, o = 1 } = {}) => {
  n.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s * sx},${s * sy})`;
  n.style.opacity = o; n.style.visibility = o <= 0.001 || s * sx * sy === 0 ? "hidden" : "visible";
};

// ───────── mascotte (le T à l'œil) ─────────
const T = window.T_PATH; let mid = 0;
function mascot(parent, width) {
  const id = "m" + mid++;
  const n = el(`<div class="a" style="width:${width}px"><svg viewBox="190 200 880 910" width="${width}" height="${width * 910 / 880}">
    <defs><clipPath id="${id}t"><path d="${T}"/></clipPath><clipPath id="${id}e"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)"/></clipPath></defs>
    <path d="${T}" fill="#fe6132"/>
    <g clip-path="url(#${id}t)"><g class="lid"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)" fill="#fff"/>
    <g clip-path="url(#${id}e)"><circle class="pupil" cx="444" cy="458" r="50" fill="#fe6132"/></g></g></g></svg></div>`, parent);
  n.eye = (open, dx = 0, dy = 0) => { n.querySelector(".lid").setAttribute("transform", `translate(382 430) scale(1 ${Math.max(0.06, open)}) translate(-382 -430)`); n.querySelector(".pupil").setAttribute("transform", `translate(${dx} ${dy})`); };
  return n;
}
const blink = (t, at) => (t > at && t < at + 0.16 ? 0.06 : 1);

// ───────── couches (chaque scène a son fond qui s'ouvre en cercle) ─────────
const SCENES = [
  { start: 0, color: "var(--violet)", from: [540, 960] },
  { start: 2.4, color: "var(--orange)", from: [540, 1500] },
  { start: 4.8, color: "var(--creme)", from: [880, 260] },
  { start: 9.8, color: "var(--violet)", from: [160, 1650] },
  { start: 12.4, color: "var(--orange)", from: [540, 700] },
];
SCENES.forEach((sc) => {
  const R = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - sc.from[0], y - sc.from[1]))) + 10;
  sc.layer = el(`<div class="layer"></div>`);
  sc.wipe = el(`<div class="wipe" style="width:${2 * R}px;height:${2 * R}px;left:${sc.from[0] - R}px;top:${sc.from[1] - R}px;background:${sc.color}"></div>`, sc.layer);
  sc.c = el(`<div class="content"></div>`, sc.layer);
});
const [S1, S2, S3, S4, S5] = SCENES.map((s) => s.c);

// formes décoratives qui flottent
const deco = (parent, list, color) => list.map(([x, y, r]) => ({ x, y, r, n: el(`<div class="a blob" style="width:${2 * r}px;height:${2 * r}px;background:${color}"></div>`, parent) }));
const decoV1 = deco(S1, [[120, 260, 90], [960, 520, 140], [170, 1500, 60], [900, 1650, 110]], "rgba(255,255,255,.07)");
const decoO2 = deco(S2, [[150, 330, 120], [940, 1250, 170], [120, 1650, 70]], "rgba(255,255,255,.12)");
const decoV4 = deco(S4, [[960, 180, 120], [110, 1520, 150], [990, 1600, 60]], "rgba(255,255,255,.07)");
const decoO5 = deco(S5, [[130, 250, 110], [970, 1150, 150], [150, 1700, 90]], "rgba(255,255,255,.12)");
const floatDeco = (arr, t) => arr.forEach((d, i) => place(d.n, { x: d.x + Math.sin(t * 0.9 + i * 2) * 18, y: d.y + Math.cos(t * 0.7 + i) * 24 }));

// ───────── scène 1 : accroche ─────────
const s1a = el(`<div class="a txt" style="font-size:104px">Tu veux des</div>`, S1);
const s1b = el(`<div class="a txt" style="font-size:190px">articles</div>`, S1);
const s1c = el(`<div class="a txt pill" style="font-size:150px;background:#fff;color:var(--orange)">de Chine ?</div>`, S1);
const m1 = mascot(S1, 560);

// ───────── scène 2 : problème → solution ─────────
const s2a = el(`<div class="a txt" style="font-size:124px">Trop compliqué ?</div>`, S2);
const s2b = el(`<div class="a txt" style="font-size:124px">Trop loin ?</div>`, S2);
const strike = (w) => el(`<div class="a" style="width:${w}px;height:22px"><div style="width:100%;height:100%;border-radius:11px;background:var(--nuit);transform-origin:left center"></div></div>`, S2);
const s2sa = strike(900), s2sb = strike(640);
const s2st = el(`<div class="a txt" style="font-size:128px;line-height:1.02;text-align:center;background:var(--violet);border-radius:56px;padding:40px 64px 52px;box-shadow:0 18px 0 var(--nuit)">On s'en<br>occupe !</div>`, S2);

// ───────── scène 3 : comment ça marche ─────────
const s3t = el(`<div class="a txt" style="font-size:92px;color:var(--violet)">Comment ça marche ?</div>`, S3);
const map = el(`<svg class="a" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0">
  <defs><mask id="trail" maskUnits="userSpaceOnUse"><path id="trailMask" d="" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"/></mask></defs>
  <path id="route" d="M770 500 C 860 700, 400 540, 360 760" fill="none" stroke="none"/>
  <path d="M770 500 C 860 700, 400 540, 360 760" fill="none" stroke="#fe6132" stroke-width="14" stroke-linecap="round" stroke-dasharray="1 30" mask="url(#trail)"/>
</svg>`, S3);
const route = map.querySelector("#route"), routeLen = route.getTotalLength();
const pin = (label, color) => el(`<div class="a" style="text-align:center">
  <svg width="120" height="150" viewBox="0 0 120 150" style="margin:0 auto"><path d="M60 146 C 30 104, 6 82, 6 56 A54 54 0 0 1 114 56 C 114 82, 90 104, 60 146Z" fill="${color}"/><circle cx="60" cy="56" r="22" fill="#fff"/></svg>
  <div class="txt pill" style="font-size:44px;background:var(--nuit);margin-top:10px;padding:10px 30px 14px">${label}</div></div>`, S3);
const pinCN = pin("CHINE", "var(--orange)");
const COAST = [[49.27,-11.95],[49.95,-13.3],[50.28,-14.9],[50.48,-15.4],[49.9,-15.6],[49.75,-16.5],[49.4,-18.15],[48.9,-19.6],[48.35,-21.23],[47.83,-22.82],[47.0,-25.03],[46.0,-25.3],[45.15,-25.6],[44.0,-24.8],[43.67,-23.35],[43.37,-21.75],[44.28,-20.28],[44.0,-18.06],[44.45,-16.2],[45.4,-15.9],[46.3,-15.7],[47.5,-14.6],[48.45,-13.6],[48.9,-12.8]];
const islandPath = (() => { const k = 420 / 13.65, pts = COAST.map(([lo, la]) => [(lo - 46.8) * 0.945 * k, (-la - 18.78) * k]);
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`; const n = pts.length;
  for (let i = 0; i < n; i++) { const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
  return d + "Z"; })();
const island = el(`<svg class="a" width="260" height="440" viewBox="-130 -220 260 440"><path d="${islandPath}" fill="#64429e"/></svg>`, S3);
const labelMG = el(`<div class="a txt pill" style="font-size:44px;background:var(--nuit);padding:10px 30px 14px">MADAGASCAR</div>`, S3);
const BOX = `<svg width="150" height="150" viewBox="0 0 100 100"><path d="M50 8 L90 26 L90 74 L50 92 L10 74 L10 26 Z" fill="#c98a4b"/><path d="M50 44 L90 26 L90 74 L50 92 Z" fill="#a86d34"/><path d="M10 26 L50 44 L90 26 L50 8 Z" fill="#e0a86a"/><path d="M30 17 L70 35 L70 50 L62 54 L62 39 L22 21 Z" fill="#fe6132"/></svg>`;
const box = el(`<div class="a">${BOX}</div>`, S3);
const plane = el(`<div class="a"><svg width="170" height="170" viewBox="0 0 100 100"><path d="M92 50 C 92 45, 86 43, 80 43 L60 43 L38 12 L28 12 L40 43 L20 43 L12 32 L5 32 L10 50 L5 68 L12 68 L20 57 L40 57 L28 88 L38 88 L60 57 L80 57 C 86 57, 92 55, 92 50 Z" fill="#64429e"/></svg></div>`, S3);
const burst = el(`<svg class="a" width="300" height="300" viewBox="-150 -150 300 300">${Array.from({ length: 8 }, (_, i) => `<line x1="0" y1="-80" x2="0" y2="-120" stroke="#fe6132" stroke-width="12" stroke-linecap="round" transform="rotate(${i * 45})"/>`).join("")}</svg>`, S3);
const step = (n, label) => el(`<div class="a" style="display:flex;align-items:center;gap:30px;width:860px">
  <div class="txt" style="flex:none;width:104px;height:104px;border-radius:50%;background:var(--orange);font-size:62px;display:flex;align-items:center;justify-content:center;padding-bottom:6px">${n}</div>
  <div class="txt" style="font-size:58px;color:var(--nuit)">${label}</div></div>`, S3);
const steps = [step(1, "Tu choisis ton article"), step(2, "On l'achète en Chine"), step(3, "Tu reçois à Madagascar")];

// ───────── scène 4 : catégories ─────────
const s4a = el(`<div class="a txt" style="font-size:104px">Mode • Tech</div>`, S4);
const s4b = el(`<div class="a txt" style="font-size:104px">Maison • Beauté</div>`, S4);
const ICONS = [
  `<path d="M30 15 L40 12 Q50 24 60 12 L70 15 L92 32 L81 47 L72 41 L72 88 L28 88 L28 41 L19 47 L8 32 Z" fill="#64429e"/>`,
  `<path d="M33 40 V30 a17 17 0 0 1 34 0 V40" stroke="#64429e" stroke-width="8" fill="none"/><rect x="14" y="38" width="72" height="52" rx="12" fill="#fe6132"/><rect x="42" y="52" width="16" height="10" rx="3" fill="#64429e"/>`,
  `<rect x="27" y="6" width="46" height="88" rx="11" fill="#64429e"/><rect x="32" y="16" width="36" height="64" rx="4" fill="#ffd9cc"/><circle cx="50" cy="87" r="3.5" fill="#fff"/><circle cx="50" cy="48" r="10" fill="#fe6132"/>`,
  `<path d="M20 62 V50 a30 30 0 0 1 60 0 V62" stroke="#64429e" stroke-width="9" fill="none"/><rect x="10" y="52" width="24" height="36" rx="10" fill="#fe6132"/><rect x="66" y="52" width="24" height="36" rx="10" fill="#fe6132"/>`,
  `<rect x="44" y="22" width="12" height="10" rx="3" fill="#64429e"/><rect x="12" y="32" width="76" height="12" rx="6" fill="#64429e"/><rect x="18" y="44" width="64" height="40" rx="10" fill="#fe6132"/><rect x="4" y="52" width="16" height="8" rx="4" fill="#64429e"/><rect x="80" y="52" width="16" height="8" rx="4" fill="#64429e"/>`,
  `<path d="M40 43 V24 L60 12 V43 Z" fill="#fe6132"/><rect x="37" y="41" width="26" height="16" rx="3" fill="#f3b04a"/><rect x="33" y="55" width="34" height="38" rx="5" fill="#64429e"/>`,
];
const cards = ICONS.map((ic) => el(`<div class="a" style="width:270px;height:270px;border-radius:56px;background:var(--creme);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 0 rgba(0,0,0,.18)"><svg width="170" height="170" viewBox="0 0 100 100">${ic}</svg></div>`, S4));
const s4c = el(`<div class="a txt pill" style="font-size:80px;background:var(--orange)">…et bien plus !</div>`, S4);

// ───────── scène 5 : Tadaa ─────────
const logo = el(`<div class="a"><svg width="640" height="640" viewBox="0 0 1254 1254">
  <defs><clipPath id="ld"><circle cx="626.5" cy="623.5" r="612"/></clipPath><clipPath id="lt"><path d="${T}"/></clipPath>
  <clipPath id="le"><ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)"/></clipPath></defs>
  <circle cx="626.5" cy="623.5" r="612" fill="#64429e"/>
  <g clip-path="url(#ld)"><g id="lT"><path d="${T}" fill="#fe6132"/><g clip-path="url(#lt)"><g id="lLid">
  <ellipse cx="382" cy="418" rx="82" ry="122" transform="rotate(3 382 418)" fill="#fff"/><g clip-path="url(#le)"><circle id="lPupil" cx="444" cy="458" r="50" fill="#fe6132"/></g></g></g></g></g></svg></div>`, S5);
const lT = logo.querySelector("#lT"), lLid = logo.querySelector("#lLid"), lPupil = logo.querySelector("#lPupil");
const confetti = el(`<svg class="a" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>`, S5);
const CONF = Array.from({ length: 46 }, (_, i) => {
  const a = -Math.PI / 2 + (rnd() - 0.5) * 2.6, v = 900 + rnd() * 900, col = ["#64429e", "#fff", "#ffd23f", "#2b1a4a", "#fff3e6"][i % 5];
  const n = document.createElementNS("http://www.w3.org/2000/svg", i % 3 ? "rect" : "circle");
  if (i % 3) { n.setAttribute("width", 18 + rnd() * 14); n.setAttribute("height", 30 + rnd() * 16); n.setAttribute("x", -14); n.setAttribute("y", -20); } else n.setAttribute("r", 11 + rnd() * 7);
  n.setAttribute("fill", col); confetti.appendChild(n);
  return { n, vx: Math.cos(a) * v, vy: Math.sin(a) * v, spin: (rnd() - 0.5) * 900 };
});
const letters = [..."Tadaa"].map((c) => el(`<div class="a txt" style="font-size:250px;text-shadow:0 16px 0 var(--violet)">${c}</div>`, S5));
const LX = [215, 385, 545, 710, 870];
const s5t = el(`<div class="a txt" style="font-size:68px">De la Chine à Madagascar</div>`, S5);
const s5c = el(`<div class="a txt pill" style="font-size:56px;background:#fff;color:var(--violet);box-shadow:0 10px 0 var(--nuit)">Écris-nous en message privé</div>`, S5);

// ───────── l'image à l'instant t ─────────
window.seek = (t) => {
  SCENES.forEach((sc, i) => {
    const next = SCENES[i + 1], visible = t >= sc.start && (!next || t < next.start + 0.6);
    sc.layer.style.display = visible ? "block" : "none";
    const k = i === 0 ? 1 : inOut(pr(t, sc.start, 0.55));
    sc.wipe.style.transform = `scale(${k})`;
    sc.c.style.opacity = i === 0 ? 1 : pr(t, sc.start + 0.12, 0.2);
  });

  // 1 — accroche
  floatDeco(decoV1, t);
  place(s1a, { y: 470, s: pop(t, 0.1, 0.35), r: lerp(-8, 0, pr(t, 0.1, 0.35)) });
  place(s1b, { y: 640, s: pop(t, 0.35, 0.4), r: lerp(6, 0, pr(t, 0.35, 0.4)) });
  place(s1c, { y: 840, s: pop(t, 0.7, 0.45), r: lerp(-10, -3, pr(t, 0.7, 0.45)) + Math.sin(t * 5) * 1.2 * pr(t, 1.2, 0.3) });
  place(m1, { y: lerp(2300, 1480, outBack(pr(t, 0.45, 0.55), 1.4)), r: 6 + Math.sin(t * 3) * 2 });
  m1.eye(blink(t, 1.95) * (t < 1.05 ? 0.06 : lerp(0.06, 1, pr(t, 1.05, 0.12))), keys(t, [[1.2, 0], [1.4, -40]]), keys(t, [[1.2, 0], [1.4, -46]]));

  // 2 — problème → on s'en occupe
  floatDeco(decoO2, t);
  const shake = t > 3.95 && t < 4.2 ? Math.sin(t * 120) * 14 * (1 - pr(t, 3.95, 0.25)) : 0;
  S2.style.transform = `translate(${shake}px, ${shake * 0.6}px)`;
  place(s2a, { y: 520, s: pop(t, 2.6, 0.35), o: lerp(1, 0.55, pr(t, 3.4, 0.2)) });
  place(s2b, { y: 700, s: pop(t, 2.95, 0.35), o: lerp(1, 0.55, pr(t, 3.55, 0.2)) });
  place(s2sa, { y: 528, r: -3, o: t > 3.3 ? 1 : 0 }); s2sa.firstChild.style.transform = `scaleX(${outCubic(pr(t, 3.3, 0.18))})`;
  place(s2sb, { y: 708, r: 3, o: t > 3.45 ? 1 : 0 }); s2sb.firstChild.style.transform = `scaleX(${outCubic(pr(t, 3.45, 0.18))})`;
  const st = pr(t, 3.75, 0.2);
  place(s2st, { y: 1010, s: t < 3.75 ? 0 : lerp(2.3, 1, inCubic(st)), r: -5, o: st });

  // 3 — comment ça marche
  place(s3t, { y: 220, s: pop(t, 5.0, 0.4) });
  place(pinCN, { x: 770, y: 410, s: pop(t, 5.3, 0.4) });
  place(island, { x: 330, y: 800, s: pop(t, 5.55, 0.45), r: lerp(-12, 0, pr(t, 5.55, 0.45)) });
  place(labelMG, { x: 300, y: 1085, s: pop(t, 5.75, 0.35) });
  const fly = inOut(pr(t, 7.0, 1.3));
  const head = route.getPointAtLength(fly * routeLen);
  let dpath = "M770 500"; for (let i = 1; i <= 40; i++) { const q = route.getPointAtLength((fly * i / 40) * routeLen); dpath += ` L${q.x.toFixed(1)} ${q.y.toFixed(1)}`; }
  map.querySelector("#trailMask").setAttribute("d", fly > 0 ? dpath : "M0 0");
  const ahead = route.getPointAtLength(Math.min(routeLen, fly * routeLen + 4)), back = route.getPointAtLength(Math.max(0, fly * routeLen - 4));
  const ang = Math.atan2(ahead.y - back.y, ahead.x - back.x) * 180 / Math.PI;
  place(plane, { x: head.x, y: head.y, r: ang, s: t < 6.85 ? 0 : t < 8.3 ? pop(t, 6.85, 0.3) : 1 - pr(t, 8.3, 0.15) });
  // colis : apparaît en Chine, embarque, atterrit à Madagascar
  if (t < 8.4) place(box, { x: 790, y: 560, s: t < 7.0 ? pop(t, 6.35, 0.4) : 1 - pr(t, 7.0, 0.15), r: Math.sin(t * 6) * 4 });
  else place(box, { x: 345, y: lerp(500, 800, outBack(pr(t, 8.4, 0.35), 2.2)), s: pop(t, 8.4, 0.3), r: lerp(-20, 0, pr(t, 8.4, 0.35)) });
  const b = pr(t, 8.62, 0.4);
  place(burst, { x: 345, y: 800, s: lerp(0.7, 1.4, outCubic(b)), o: t < 8.62 ? 0 : 1 - b });
  [5.6, 6.35, 8.6].forEach((a, i) => { const k = outCubic(pr(t, a, 0.4)); place(steps[i], { x: 540 + lerp(-160, 0, k), y: 1240 + i * 128, o: k, s: 1 + 0.06 * Math.sin(Math.PI * pr(t, a + 0.25, 0.35)) }); });

  // 4 — catégories
  floatDeco(decoV4, t);
  place(s4a, { y: 300, s: pop(t, 10.0, 0.4) });
  place(s4b, { y: 420, s: pop(t, 10.15, 0.4) });
  cards.forEach((c, i) => { const a = 10.35 + i * 0.1; place(c, { x: [235, 540, 845][i % 3], y: (i < 3 ? 690 : 1000) + Math.sin(t * 3 + i) * 8 * pr(t, a + 0.4, 0.3), s: pop(t, a, 0.4), r: lerp(i % 2 ? 14 : -14, 0, pr(t, a, 0.45)) + Math.sin(t * 2.4 + i * 1.3) * 2 }); });
  place(s4c, { y: 1290, s: pop(t, 11.35, 0.4), r: -3 });

  // 5 — Tadaa
  floatDeco(decoO5, t);
  place(logo, { y: 650, s: t < 12.55 ? 0 : outBack(pr(t, 12.55, 0.45), 1.5), r: Math.sin(t * 2) * 1.5 * pr(t, 13.6, 0.4) });
  const drop = inCubic(pr(t, 12.75, 0.3));
  const sq = keys(t, [[13.05, 1], [13.13, 0.8], [13.28, 1.08], [13.4, 0.97], [13.5, 1]]);
  lT.setAttribute("transform", `translate(0 ${lerp(-1250, 0, drop)}) translate(690 1060) scale(${2 - sq} ${t < 13.05 ? 1.06 : sq}) translate(-690 -1060)`);
  const lidOpen = (t < 13.32 ? 0.06 : keys(t, [[13.32, 0.06], [13.42, 1.08], [13.5, 1]])) * blink(t, 15.1);
  lLid.setAttribute("transform", `translate(382 430) scale(1 ${Math.max(0.06, lidOpen)}) translate(-382 -430)`);
  lPupil.setAttribute("transform", `translate(${keys(t, [[13.7, 0], [13.9, -20], [14.6, -20], [14.8, 0]])} ${keys(t, [[13.7, 0], [13.9, 30], [14.6, 30], [14.8, 0]])})`);
  letters.forEach((n, i) => { const a = 13.15 + i * 0.07, k = pr(t, a, 0.45); place(n, { x: LX[i], y: 1150 + lerp(-180, 0, outBack(k, 2)) + Math.sin(t * 6 - i * 0.9) * 10 * pr(t, 14.0, 0.4), s: t < a ? 0 : lerp(0.3, 1, outBack(k, 2.5)), r: lerp([-14, 10, -8, 12, -10][i], 0, outCubic(k)) }); });
  const ct = t - 13.15;
  confetti.style.visibility = ct > 0 && ct < 2 ? "visible" : "hidden";
  CONF.forEach((c) => { const x = 540 + c.vx * ct * 0.8, y = 1120 + c.vy * ct * 0.8 + 1300 * ct * ct; c.n.setAttribute("transform", `translate(${x} ${y}) rotate(${c.spin * ct})`); c.n.setAttribute("opacity", 1 - cl((ct - 1.2) / 0.6)); });
  place(s5t, { y: 1340 + lerp(40, 0, outCubic(pr(t, 13.75, 0.4))), o: pr(t, 13.75, 0.35) });
  place(s5c, { y: 1470, s: pop(t, 14.2, 0.45) * (1 + 0.035 * Math.sin((t - 14.6) * 7) * pr(t, 14.6, 0.3)) });
};

// ───────── bruitages (rendus hors temps réel) ─────────
window.renderAudio = async () => {
  const SR = 48000, ctx = new OfflineAudioContext(2, SR * DUR, SR);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ctx.destination);
  const noiseBuf = ctx.createBuffer(1, SR * 2, SR); const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const tone = (t, f0, f1, d, vol = 0.4, type = "sine") => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); env(g, t, 0.005, vol, d); o.connect(g).connect(master); o.start(t); o.stop(t + d + 0.05); };
  const noise = (t, d, f0, f1, vol = 0.3, q = 1.2, type = "bandpass") => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noiseBuf; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + d * 0.45); g.gain.linearRampToValueAtTime(0, t + d); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + d); };
  const popS = (t, f = 520, v = 0.35) => tone(t, f * 1.8, f, 0.09, v);
  const whoosh = (t, d = 0.5) => noise(t - 0.1, d, 300, 3500, 0.35);
  const thud = (t, v = 0.8) => { tone(t, 160, 45, 0.25, v); noise(t, 0.08, 1200, 300, 0.25, 0.8, "lowpass"); };
  // 1
  [[0.1, 480], [0.35, 560], [0.7, 660]].forEach(([t, f]) => popS(t, f)); noise(0.45, 0.4, 600, 1800, 0.18); popS(1.05, 900, 0.18);
  // 2
  whoosh(2.4); popS(2.6, 520); popS(2.95, 600); noise(3.3, 0.16, 3000, 1500, 0.28, 0.7, "highpass"); noise(3.45, 0.16, 3000, 1500, 0.28, 0.7, "highpass"); thud(3.95, 1); popS(4.1, 700, 0.2);
  // 3
  whoosh(4.8); popS(5.0, 520); popS(5.3, 620); popS(5.55, 560); popS(5.75, 700, 0.2);
  [5.6, 6.35, 8.6].forEach((t, i) => tone(t, 880 * [1, 1.26, 1.5][i], 880 * [1, 1.26, 1.5][i], 0.25, 0.16, "triangle"));
  popS(6.35, 460); noise(6.95, 1.45, 250, 1400, 0.3, 0.9); thud(8.55, 0.7);
  // 4
  whoosh(9.8); popS(10.0, 540); popS(10.15, 600); for (let i = 0; i < 6; i++) popS(10.35 + i * 0.1, 500 + i * 70, 0.25); popS(11.35, 760);
  // 5 — « ta-daa »
  whoosh(12.4); popS(12.55, 420, 0.4); noise(12.75, 0.3, 500, 2500, 0.2); thud(13.05, 0.9);
  const chord = (t, freqs, d, vol) => freqs.forEach((f) => { tone(t, f, f, d, vol, "triangle"); tone(t, f * 2, f * 2, d * 0.6, vol * 0.25, "sine"); });
  chord(13.12, [784, 988], 0.16, 0.16); chord(13.32, [1047, 1319, 1568], 1.3, 0.14);
  for (let i = 0; i < 10; i++) tone(13.3 + i * 0.07, 2400 + (i * 397) % 1800, 2400 + (i * 397) % 1800, 0.18, 0.05);
  popS(14.2, 650, 0.3);
  const buf = await ctx.startRendering();
  // WAV 16 bits stéréo en base64
  const n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4)), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const ws = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  ws(0, "RIFF"); out.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); ws(36, "data"); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  const bytes = new Uint8Array(out.buffer); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

window.ready = Promise.all([document.fonts.load("700 100px Fredoka"), document.fonts.load("600 100px Fredoka")]).then(() => document.fonts.ready).then(() => window.seek(0));
