<script>
const DUR=6;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const expOut=x=>x>=1?1:1-Math.pow(2,-10*x);
const expInOut=x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;
const sineIO=x=>-(Math.cos(Math.PI*x)-1)/2;
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// Points du logo (repère 486×800)
const BASE={x:163,y:388};   // tête de la torche = point d'allumage
const FC={x:250,y:200};     // cœur de la flamme = centre de la lueur
// Position « héros » (centrée, légèrement haute)
const H={s:627/800}; H.x=1280-486*H.s/2; H.y=(1440-627)/2-30;
// Position finale = bannière (mêmes valeurs que banniere_youtube.svg)
const L={s:380/800}; const LW=486*L.s, NW=1080, NS=NW/6376, GAP=90;
L.x=1280-(LW+GAP+NW)/2; L.y=720-190;
const XT=L.x+LW+GAP, YB=720-152, BASEL=YB+56+1067*NS;

function logoAt(t){
  const dy=lerp(760,0,1-Math.pow(1-seg(t,1.0,2.0),3));
  const m=expInOut(seg(t,3.0,3.9));
  return {x:lerp(H.x,L.x,m), y:lerp(H.y,L.y,m)+dy, s:lerp(H.s,L.s,m)};
}
const map=(T,p)=>({x:T.x+p.x*T.s, y:T.y+p.y*T.s});
// Vacillement : mêmes clés que le CSS (0 / -2 / 1,2 / -0,8 / 0 deg ; 1 / 1,025 / 0,985 / 1,015 / 1), période 3,2 s
const SK=[0,-2,1.2,-.8,0], SY=[1,1.025,.985,1.015,1];
function flick(t){
  const amp=sineIO(seg(t,2.7,3.3)); if(amp<=0) return {sk:0,sy:1,pulse:0};
  const u=((t-2.7)/3.2)%1, q=Math.min(3,Math.floor(u*4)), f=sineIO(u*4-q);
  return {sk:amp*lerp(SK[q],SK[q+1],f), sy:1+amp*(lerp(SY[q],SY[q+1],f)-1), pulse:amp*(.5-.5*Math.cos(2*Math.PI*u))};
}
const SPARK=map({x:H.x,y:H.y,s:H.s},BASE);

const em=[];
function setup(){
  // slogan calé sur la largeur du nom (même calcul que la bannière)
  const tag=$('tag'), w0=tag.getComputedTextLength(), k=NW/w0;
  tag.setAttribute('font-size',(30*k).toFixed(2)); tag.setAttribute('letter-spacing',(5*k).toFixed(2));
  tag.setAttribute('x',XT+2); tag.setAttribute('y',BASEL+88);
  $('eyebrow').setAttribute('x',XT+4); $('rule').setAttribute('x',XT+4); $('rule').setAttribute('y',BASEL+30);
  $('wipeR').setAttribute('x',XT-8);
  const g=$('embers');
  for(let i=0;i<30;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');g.appendChild(c);
    em.push({el:c,born:2.05+rnd(i+50)*3.3,life:1.3+rnd(i+90)*1.2,r:3.5+rnd(i+20)*4.5,
      p:{x:120+rnd(i)*300,y:40+rnd(i+11)*160},drift:(rnd(i+7)-.5)*140,rise:260+rnd(i+3)*260});}
}

window.seek=function(t){
  // caméra : léger recul continu, s'arrête pile à 1 à la fin
  const z=lerp(1.035,1,sineIO(seg(t,0,DUR)));
  $('cam').setAttribute('transform',`translate(1280 720) scale(${z}) translate(-1280 -720)`);

  // 1. étincelle : naît, s'élève, puis se fond dans la flamme
  const sIn=expOut(seg(t,.2,.9)), sGone=seg(t,2.0,2.2);
  const sy=SPARK.y+lerp(70,0,expOut(seg(t,.2,1.8)));
  const sr=(12+2*Math.sin(t*11))*sIn*(1-sGone);
  $('spark').setAttribute('cx',SPARK.x); $('spark').setAttribute('cy',sy); $('spark').setAttribute('r',Math.max(sr,0.001));
  const hr=lerp(0,120,sIn)*(1-sGone);
  $('haloE').setAttribute('transform',`translate(${SPARK.x} ${sy}) scale(${Math.max(hr,0.001)})`);

  // 2. la lumière s'ouvre depuis l'étincelle
  const rc=$('revc'); rc.setAttribute('cx',SPARK.x); rc.setAttribute('cy',SPARK.y);
  rc.setAttribute('r',lerp(0,2600,sineIO(seg(t,.6,2.1))));

  // 3. torche + flamme
  const T=logoAt(t), fl=flick(t);
  $('logo').setAttribute('transform',`translate(${T.x} ${T.y}) scale(${T.s})`);
  const ig=seg(t,2.0,2.7), fs=lerp(.04,1,expOut(ig));
  $('flame').setAttribute('transform',`translate(${BASE.x} ${BASE.y}) skewX(${fl.sk}) scale(${fs} ${fs*fl.sy}) translate(${-BASE.x} ${-BASE.y})`);
  $('flame').setAttribute('opacity',cl((t-2.0)/.05));

  // 4. lueur : suit l'étincelle puis le cœur de la flamme
  const fc=map(T,FC), ign=expOut(ig);
  const gx=lerp(SPARK.x,fc.x,ign), gy=lerp(sy,fc.y,ign);
  const Rpre=lerp(40,520,expInOut(seg(t,.3,2.0))), Rpost=560*T.s/L.s;
  const puff=t<2?0:Math.exp(-(t-2)*4)*(1-Math.exp(-(t-2)*40));
  const R=lerp(Rpre,Rpost,ign)*(1+.18*puff);
  const ge=$('glowE'); ge.setAttribute('transform',`translate(${gx} ${gy}) scale(${R*lerp(1,1.3,ign)} ${R})`);
  ge.setAttribute('opacity',(1-.3*fl.pulse).toFixed(3));

  // 5. braises : partent de la flamme là où elle est à leur naissance
  em.forEach(e=>{const a=(t-e.born)/e.life; if(a<0||a>1){e.el.setAttribute('r',0);return;}
    const P=map(logoAt(e.born),e.p), sc=logoAt(e.born).s/L.s;
    e.el.setAttribute('cx',P.x+e.drift*a*sc+8*Math.sin(t*3+e.p.x)); e.el.setAttribute('cy',P.y-e.rise*a*sc);
    e.el.setAttribute('r',e.r*sc*(1-a*.7)); e.el.setAttribute('opacity',(Math.sin(Math.PI*a)*.6).toFixed(3));});

  // 6. le nom sort de derrière la torche
  const ni=seg(t,3.45,4.35);
  $('wipeR').setAttribute('width',(NW+40)*expInOut(ni));
  $('name').setAttribute('transform',`translate(${XT+lerp(-50,0,expOut(ni))} ${BASEL}) scale(${NS})`);

  // 7. surtitre, trait, slogan
  const e1=expOut(seg(t,4.0,4.6)); $('eyebrow').setAttribute('y',YB+22+lerp(14,0,e1)); $('eyebrow').setAttribute('opacity',e1);
  $('rule').setAttribute('width',90*expOut(seg(t,4.15,4.7)));
  const e2=expOut(seg(t,4.25,4.95)); $('tag').setAttribute('transform',`translate(0 ${lerp(16,0,e2)})`); $('tag').setAttribute('opacity',e2);
};

// ---- bande-son : chaque son tombe sur un événement de l'image ----
window.renderAudio=async function(){
  const sr=48000,len=Math.ceil(DUR*sr),ac=new OfflineAudioContext(2,len,sr);
  const master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
  const conv=ac.createConvolver(),ir=ac.createBuffer(2,sr*3,sr);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(rnd(i*7+c)*2-1)*Math.pow(1-i/d.length,3);}
  conv.buffer=ir;const wet=ac.createGain();wet.gain.value=.35;conv.connect(wet);wet.connect(master);
  const bus=ac.createGain();bus.connect(master);bus.connect(conv);
  const noise=(sec)=>{const b=ac.createBuffer(1,sr*sec,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd(i*3.1)*2-1;return b;};
  // nappe Ré majeur (add9) qui s'ouvre avec la lumière
  const pad=(f,start,peak)=>{[-5,5].forEach(dt=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.Q.value=.5;lp.frequency.setValueAtTime(250,start);lp.frequency.linearRampToValueAtTime(1600,2.3);lp.frequency.linearRampToValueAtTime(2200,4.4);
    const g=ac.createGain();g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(peak,start+2);g.gain.setValueAtTime(peak,DUR-.6);g.gain.linearRampToValueAtTime(0,DUR);
    o.connect(lp);lp.connect(g);g.connect(bus);o.start(start);o.stop(DUR);});};
  [146.83,220,293.66,329.63,369.99].forEach((f,i)=>pad(f,.3+i*.12,.032));
  pad(73.42,2.0,.05);
  const bell=(t0,f,a,dec=2.4)=>{[1,2.01,3.02].forEach((h,k)=>{const o=ac.createOscillator();o.frequency.value=f*h;const g=ac.createGain();
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(a/(k+1),t0+.008);g.gain.exponentialRampToValueAtTime(.0004,t0+dec);o.connect(g);g.connect(bus);o.start(t0);o.stop(t0+dec+.1);});};
  bell(.2,1174.66,.035,1.6);                     // l'étincelle naît
  // montée de souffle jusqu'à l'allumage, coupée net à 2,0
  {const s=ac.createBufferSource();s.buffer=noise(2);const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;
   bp.frequency.setValueAtTime(300,.6);bp.frequency.exponentialRampToValueAtTime(4200,2.0);
   const g=ac.createGain();g.gain.setValueAtTime(0,.6);g.gain.linearRampToValueAtTime(.16,1.97);g.gain.linearRampToValueAtTime(0,2.0);
   s.connect(bp);bp.connect(g);g.connect(bus);s.start(.6);s.stop(2.05);}
  // allumage : coup grave + souffle de feu
  {const o=ac.createOscillator();o.frequency.setValueAtTime(110,2.0);o.frequency.exponentialRampToValueAtTime(38,3.2);
   const g=ac.createGain();g.gain.setValueAtTime(0,2.0);g.gain.linearRampToValueAtTime(.6,2.015);g.gain.exponentialRampToValueAtTime(.001,3.8);o.connect(g);g.connect(bus);o.start(2.0);o.stop(3.9);}
  {const s=ac.createBufferSource();s.buffer=noise(1);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(2500,2.0);lp.frequency.exponentialRampToValueAtTime(400,2.7);
   const g=ac.createGain();g.gain.setValueAtTime(0,2.0);g.gain.linearRampToValueAtTime(.2,2.03);g.gain.exponentialRampToValueAtTime(.001,2.75);s.connect(lp);lp.connect(g);g.connect(bus);s.start(2.0);s.stop(2.8);}
  // glissement du logo
  {const s=ac.createBufferSource();s.buffer=noise(1.1);const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;
   bp.frequency.setValueAtTime(700,3.0);bp.frequency.exponentialRampToValueAtTime(2600,3.45);bp.frequency.exponentialRampToValueAtTime(900,3.9);
   const g=ac.createGain();g.gain.setValueAtTime(0,3.0);g.gain.linearRampToValueAtTime(.07,3.45);g.gain.linearRampToValueAtTime(0,3.95);s.connect(bp);bp.connect(g);g.connect(bus);s.start(3.0);s.stop(4.0);}
  bell(3.5,587.33,.08);                           // le nom sort
  bell(4.0,739.99,.045); bell(4.25,880,.04);      // surtitre, slogan
  const buf=await ac.startRendering();
  let pk=0;for(let c=0;c<2;c++)for(const v of buf.getChannelData(c))pk=Math.max(pk,Math.abs(v));
  const k=.89/pk,Lc=buf.getChannelData(0),Rc=buf.getChannelData(1),n=Lc.length,ab=new ArrayBuffer(44+n*4),dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){const f=Math.min(1,(n-i)/(sr*.4));dv.setInt16(44+i*4,cl(Lc[i]*k*f,-1,1)*32767,true);dv.setInt16(46+i*4,cl(Rc[i]*k*f,-1,1)*32767,true);}
  let s='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);
};
